name: keep-alive

on:
  schedule:
    - cron: '17 8 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Requête Supabase
        run: |
          curl -f -s "https://igdzdozbrdbqscuewngi.supabase.co/rest/v1/categories?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Commit pour garder le workflow actif
        run: |
          date -u > last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last-run.txt
          git commit -m "keep-alive: $(date -u +%F)" || echo "rien à committer"
          git push
